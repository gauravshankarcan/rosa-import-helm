{{- include "rosa-acm-import.validateImport" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: auto-import-secret
  namespace: {{ include "rosa-acm-import.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "rosa-acm-import.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Hint for operators; ACM may still delete this secret after successful import.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  autoImportRetry: {{ .Values.import.autoImportRetry | quote }}
{{- if .Values.import.kubeconfig }}
  kubeconfig: |
{{ .Values.import.kubeconfig | nindent 4 }}
{{- else }}
  token: {{ .Values.import.token | quote }}
  server: {{ .Values.import.server | quote }}
{{- end }}
